# '/**' matches the node under any namespace (the stack runs under /pingdsp).
# A bare 'tdss_driver:' key only matches '/tdss_driver' and is silently ignored.
/**:
  ros__parameters:
    # Network configuration
    # sonar_host: '127.0.0.1'  # Use localhost for pcap replay testing
    sonar_host: '192.168.228.50'  # Uncomment for real sonar device
    sonar_port: 23848
    reconnect_delay: 5.0
    
    # Frame IDs
    frame_id: 'sonar'
    odom_frame_id: 'odom'
    map_frame_id: 'map'
    
    # Sonar geometry.
    # transducer_tilt_deg is only a FALLBACK: by default the driver uses the
    # per-side mounting angles the sonar reports (positive = downward there,
    # negated into this file's negative = downward convention). The Orebro head
    # reports 20.0 deg on both sides, matching -20.0 here.
    # NOTE: the sonar->vehicle roll alignment is NOT set here; it lives in the
    # static base_link->sonar mount (sonar_roll in pingdsp_sbg/launch/sbg.launch).
    transducer_tilt_deg: -20.0  # Downward tilt angle of transducer
    use_reported_transducer_angles: true
    
    # NOTE: the sidescan waterfall *image* is no longer produced by this driver.
    # Run `sidescan_viewer_node` to render it on demand from the raw Ping3DSS
    # samples (keeps bags small).
